<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カメラ手振れ補正デモ</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{margin:0;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));background:#fff;color:#111}
.wrap{max-width:780px;margin:0 auto}h1{font-size:1.45rem;text-align:center;margin:6px 0 8px}.lead{text-align:center;font-size:.92rem;line-height:1.5;margin:0 0 10px}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}button{font:inherit;font-weight:700;padding:10px 8px;border:1px solid #bfc5cc;border-radius:10px;background:#fff;color:#111}button:disabled{opacity:.45}
#status{padding:9px 10px;border:1px solid #d0d7de;border-radius:10px;background:#f6f8fa;margin-bottom:10px;font-size:.88rem;line-height:1.45}.angles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.angle{border:1px solid #d0d7de;border-radius:9px;text-align:center;padding:6px 3px}.small{font-size:.75rem;opacity:.7}.num{font-weight:700;font-variant-numeric:tabular-nums}
.panel{border:1px solid #d0d7de;border-radius:12px;padding:8px;margin-bottom:10px;background:#fff}.panel-title{font-weight:800;margin:0 0 6px}.canvas-wrap{position:relative;overflow:hidden;border-radius:9px;background:#111}canvas{width:100%;height:auto;display:block;background:#111}.cross{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}.cross:before{width:2px;height:44px;left:21px;top:0}.cross:after{width:44px;height:2px;left:0;top:21px}.note{font-size:.84rem;line-height:1.5;color:#444}video{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>カメラ手振れ補正デモ</h1>
<p class="lead">遠くの目印を画面中央に合わせ，スマホの位置はなるべく動かさず，その場で左右・上下に回して比較してください．</p>
<div class="controls"><button id="start">カメラ開始</button><button id="calibrate" disabled>基準姿勢を設定</button><button id="toggle" disabled>補正：ON</button><button id="stop" disabled>停止</button></div>
<div id="status">「カメラ開始」を押してください．</div>
<div id="compAmount" style="font-weight:700;text-align:center;margin-bottom:8px;">補正量：0 px</div><div class="angles"><div class="angle"><div class="small">回転 α</div><div class="num"><span id="a">--</span>°</div></div><div class="angle"><div class="small">前後 β</div><div class="num"><span id="b">--</span>°</div></div><div class="angle"><div class="small">左右 γ</div><div class="num"><span id="g">--</span>°</div></div></div>
<div class="panel"><div class="panel-title">補正なし</div><div class="canvas-wrap"><canvas id="raw" width="640" height="250"></canvas><div class="cross"></div></div></div>
<div class="panel"><div class="panel-title">手振れ補正あり</div><div class="canvas-wrap"><canvas id="stable" width="640" height="250"></canvas><div class="cross"></div></div></div>
<p class="note">このデモは回転方向の手振れだけを強調して補正します．遠くの目印を中央の十字に合わせ，スマホを左右・上下に回してください．補正ありでは，映像を逆方向へ動かして目印が中央付近に残るようにします．</p>
<video id="video" playsinline muted></video>
</div>
<script>
const $=id=>document.getElementById(id),video=$("video"),raw=$("raw"),stable=$("stable"),rctx=raw.getContext("2d"),sctx=stable.getContext("2d");
let stream=null,running=false,compensation=true,haveOrientation=false;let latest={alpha:0,beta:0,gamma:0},base={alpha:0,beta:0,gamma:0};
function detectDevice(){const ua=navigator.userAgent||"",p=navigator.platform||"",t=navigator.maxTouchPoints||0;if(/iPhone/.test(ua))return"iPhone";if(/iPad/.test(ua)||(p==="MacIntel"&&t>1))return"iPad";if(/Android/.test(ua))return"Android";return"その他"}
function angleDiff(a,b){let d=a-b;while(d>180)d-=360;while(d<-180)d+=360;return d}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function onOrientation(e){if(Number.isFinite(e.alpha))latest.alpha=e.alpha;if(Number.isFinite(e.beta))latest.beta=e.beta;if(Number.isFinite(e.gamma))latest.gamma=e.gamma;haveOrientation=true;$("a").textContent=latest.alpha.toFixed(1);$("b").textContent=latest.beta.toFixed(1);$("g").textContent=latest.gamma.toFixed(1)}
function calibrate(){base={...latest};$("status").textContent="基準姿勢を設定しました．スマホを小さく揺らしてください．"}
function drawCover(ctx,canvas,zoom=1,dx=0,dy=0,rot=0){if(video.readyState<2)return;const cw=canvas.width,ch=canvas.height,vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return;const scale=Math.max(cw/vw,ch/vh)*zoom,dw=vw*scale,dh=vh*scale;ctx.save();ctx.clearRect(0,0,cw,ch);ctx.translate(cw/2+dx,ch/2+dy);ctx.rotate(rot);ctx.drawImage(video,-dw/2,-dh/2,dw,dh);ctx.restore()}
function render(){if(running){drawCover(rctx,raw,1,0,0,0);let dx=0,dy=0,rot=0;if(compensation&&haveOrientation){const da=angleDiff(latest.alpha,base.alpha),db=latest.beta-base.beta,dg=latest.gamma-base.gamma;dx=clamp(-dg*12,-150,150);dy=clamp(db*9,-110,110);rot=0;$("compAmount").textContent="補正量："+Math.round(Math.hypot(dx,dy))+" px"}if(!compensation)$("compAmount").textContent="補正量：0 px";drawCover(sctx,stable,1.45,dx,dy,rot)}else{rctx.fillStyle="#111";rctx.fillRect(0,0,raw.width,raw.height);sctx.fillStyle="#111";sctx.fillRect(0,0,stable.width,stable.height)}requestAnimationFrame(render)}
async function requestOrientationPermission(){if(typeof DeviceOrientationEvent==="undefined")return;if(typeof DeviceOrientationEvent.requestPermission==="function"){const result=await DeviceOrientationEvent.requestPermission();if(result!=="granted")throw new Error("姿勢センサの利用が許可されませんでした．")}window.removeEventListener("deviceorientation",onOrientation);window.addEventListener("deviceorientation",onOrientation)}
async function start(){try{if(!window.isSecureContext)throw new Error("HTTPSで開いてください．");if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("このブラウザではカメラを利用できません．");await requestOrientationPermission();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();running=true;compensation=true;if(haveOrientation)calibrate();$("start").disabled=true;$("calibrate").disabled=false;$("toggle").disabled=false;$("stop").disabled=false;$("toggle").textContent="補正：ON";$("status").textContent=detectDevice()+"：カメラ映像を取得中です．基準姿勢を設定して比較してください．"}catch(err){$("status").textContent="開始できません："+err.message}}
function stop(){running=false;if(stream){for(const track of stream.getTracks())track.stop();stream=null}video.srcObject=null;window.removeEventListener("deviceorientation",onOrientation);$("start").disabled=false;$("calibrate").disabled=true;$("toggle").disabled=true;$("stop").disabled=true;$("a").textContent="--";$("b").textContent="--";$("g").textContent="--";$("compAmount").textContent="補正量：0 px";$("status").textContent="停止中"}
$("start").addEventListener("click",start);$("calibrate").addEventListener("click",calibrate);$("toggle").addEventListener("click",()=>{compensation=!compensation;$("toggle").textContent=compensation?"補正：ON":"補正：OFF"});$("stop").addEventListener("click",stop);requestAnimationFrame(render);
</script>
</body></html>
