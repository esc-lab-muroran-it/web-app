<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマートフォン センサー計測</title>

<style>
:root{
  color-scheme: light;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
body{
  margin:0;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  background:#ffffff;
  color:#000000;
}
.wrap{
  max-width:900px;
  margin:0 auto;
}
h1{
  font-size:1.5rem;
  margin:8px 0 12px;
}
.device{
  padding:10px 12px;
  border:1px solid #d0d7de;
  border-radius:10px;
  margin-bottom:12px;
  background:#f6f8fa;
  font-weight:700;
}
.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
button{
  font:inherit;
  font-weight:700;
  padding:10px 16px;
  border:1px solid #bfc5cc;
  border-radius:10px;
  background:#ffffff;
  color:#000000;
}
button:disabled{
  opacity:.45;
}
.sensor-select{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}
.sensor-btn{
  padding:14px;
  font-size:1.05rem;
}
.sensor-btn.active{
  outline:3px solid rgba(0,120,255,.4);
}
#status{
  padding:10px 12px;
  border:1px solid #d0d7de;
  border-radius:10px;
  margin-bottom:14px;
  background:#ffffff;
}
.panel{
  border:1px solid #d0d7de;
  border-radius:12px;
  padding:12px;
  background:#ffffff;
}
.panel h2{
  font-size:1.15rem;
  margin:0 0 10px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-bottom:14px;
}
.card{
  border:1px solid #d0d7de;
  border-radius:12px;
  padding:10px;
  text-align:center;
  background:#ffffff;
}
.label{
  font-size:.9rem;
  opacity:.7;
}
.value{
  font-size:1.35rem;
  font-variant-numeric:tabular-nums;
}
canvas{
  display:block;
  width:100%;
  height:320px;
  border-radius:8px;
  background:#fafafa;
  border:1px solid #e5e7eb;
}
.legend{
  display:flex;
  gap:16px;
  margin-top:8px;
  font-size:.95rem;
}
.legend span::before{
  content:"●";
  margin-right:5px;
}
.x::before{color:#d33;}
.y::before{color:#2a7;}
.z::before{color:#37c;}

@media(max-width:600px){
  canvas{height:280px;}
}
</style>
</head>

<body>
<div class="wrap">

<h1>スマートフォン センサー計測</h1>

<div id="deviceInfo" class="device">使用端末：判定中</div>

<div class="buttons">
  <button id="start">センサー開始</button>
  <button id="stop" disabled>停止</button>
  <button id="clear">グラフ消去</button>
</div>

<div class="sensor-select">
  <button id="accelBtn" class="sensor-btn active">加速度</button>
  <button id="gyroBtn" class="sensor-btn">回転速度</button>
</div>

<div id="status">待機中</div>

<div class="panel">
  <h2 id="graphTitle">加速度［m/s²］</h2>

  <div class="cards">
    <div class="card">
      <div id="label1" class="label">X</div>
      <div id="value1" class="value">---</div>
    </div>
    <div class="card">
      <div id="label2" class="label">Y</div>
      <div id="value2" class="value">---</div>
    </div>
    <div class="card">
      <div id="label3" class="label">Z</div>
      <div id="value3" class="value">---</div>
    </div>
  </div>

  <canvas id="graph"></canvas>

  <div class="legend">
    <span id="legend1" class="x">X</span>
    <span id="legend2" class="y">Y</span>
    <span id="legend3" class="z">Z</span>
  </div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

const canvas = $("graph");
const ctx = canvas.getContext("2d");

const MAX_POINTS = 200;
const PLOT_INTERVAL = 50;

let mode = "accel";
let running = false;
let lastPlot = 0;

const accelData = { x:[], y:[], z:[] };
const gyroData  = { a:[], b:[], g:[] };

let latestAccel = { x:null, y:null, z:null };
let latestGyro  = { a:null, b:null, g:null };

function detectDevice(){
  const ua = navigator.userAgent || "";
  const platform = navigator.platform || "";
  const maxTouchPoints = navigator.maxTouchPoints || 0;

  const isiPhone = /iPhone/.test(ua);
  const isiPad =
    /iPad/.test(ua) ||
    (platform === "MacIntel" && maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

  if(isiPhone) return "iPhone";
  if(isiPad) return "iPad";
  if(isAndroid) return "Android";
  return "その他";
}

const deviceType = detectDevice();
$("deviceInfo").textContent = "使用端末：" + deviceType;

function fmt(v){
  return (typeof v === "number" && Number.isFinite(v))
    ? v.toFixed(2)
    : "---";
}

function push(arr, v){
  arr.push(v);
  if(arr.length > MAX_POINTS) arr.shift();
}

function setMode(newMode){
  mode = newMode;

  if(mode === "accel"){
    $("accelBtn").classList.add("active");
    $("gyroBtn").classList.remove("active");

    $("graphTitle").textContent = "加速度［m/s²］";
    $("label1").textContent = "X";
    $("label2").textContent = "Y";
    $("label3").textContent = "Z";
    $("legend1").textContent = "X";
    $("legend2").textContent = "Y";
    $("legend3").textContent = "Z";
  }else{
    $("gyroBtn").classList.add("active");
    $("accelBtn").classList.remove("active");

    $("graphTitle").textContent = "回転速度［deg/s］";
    $("label1").textContent = "α";
    $("label2").textContent = "β";
    $("label3").textContent = "γ";
    $("legend1").textContent = "α";
    $("legend2").textContent = "β";
    $("legend3").textContent = "γ";
  }

  updateValues();
  drawGraph();
}

function updateValues(){
  if(mode === "accel"){
    $("value1").textContent = fmt(latestAccel.x);
    $("value2").textContent = fmt(latestAccel.y);
    $("value3").textContent = fmt(latestAccel.z);
  }else{
    $("value1").textContent = fmt(latestGyro.a);
    $("value2").textContent = fmt(latestGyro.b);
    $("value3").textContent = fmt(latestGyro.g);
  }
}

function resizeCanvas(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGraph();
}

function drawGraph(){
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  ctx.clearRect(0, 0, w, h);

  let ymin, ymax, arrays;

  if(mode === "accel"){
    ymin = -20;
    ymax = 20;
    arrays = [accelData.x, accelData.y, accelData.z];
  }else{
    ymin = -300;
    ymax = 300;
    arrays = [gyroData.a, gyroData.b, gyroData.g];
  }

  // horizontal grid
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(127,127,127,.25)";
  ctx.beginPath();

  const gridCount = 6;
  for(let i=0; i<=gridCount; i++){
    const y = i / gridCount * h;
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
  }
  ctx.stroke();

  // zero line
  const zeroY = h - (0 - ymin) / (ymax - ymin) * h;
  ctx.strokeStyle = "rgba(127,127,127,.55)";
  ctx.beginPath();
  ctx.moveTo(0, zeroY);
  ctx.lineTo(w, zeroY);
  ctx.stroke();

  function plot(arr, color){
    if(arr.length < 2) return;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();

    arr.forEach((v, i) => {
      const x = i / (MAX_POINTS - 1) * w;
      const value = Math.max(ymin, Math.min(ymax, v));
      const y = h - (value - ymin) / (ymax - ymin) * h;

      if(i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });

    ctx.stroke();
  }

  plot(arrays[0], "#d33");
  plot(arrays[1], "#2a7");
  plot(arrays[2], "#37c");

  ctx.fillStyle = "rgba(80,80,80,.85)";
  ctx.font = "12px sans-serif";

  ctx.fillText(ymax.toString(), 5, 14);
  ctx.fillText("0", 5, zeroY - 4);
  ctx.fillText(ymin.toString(), 5, h - 5);
}

function onMotion(e){
  if(!running) return;

  const a = e.accelerationIncludingGravity || e.acceleration || {};
  const r = e.rotationRate || {};

  latestAccel.x = a.x;
  latestAccel.y = a.y;
  latestAccel.z = a.z;

  latestGyro.a = r.alpha;
  latestGyro.b = r.beta;
  latestGyro.g = r.gamma;

  updateValues();

  const now = performance.now();

  if(now - lastPlot >= PLOT_INTERVAL){
    if(typeof a.x === "number"){
      push(accelData.x, a.x);
      push(accelData.y, a.y);
      push(accelData.z, a.z);
    }

    if(typeof r.alpha === "number"){
      push(gyroData.a, r.alpha);
      push(gyroData.b, r.beta);
      push(gyroData.g, r.gamma);
    }

    lastPlot = now;
    drawGraph();
  }
}

async function startSensor(){
  try{
    if(!window.isSecureContext){
      throw new Error("HTTPSで開いてください．");
    }

    if(typeof DeviceMotionEvent === "undefined"){
      throw new Error("この端末ではモーションセンサーを利用できません．");
    }

    // iPhone / iPad Safari では明示的な許可が必要
    if(
      (deviceType === "iPhone" || deviceType === "iPad") &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ){
      const result = await DeviceMotionEvent.requestPermission();

      if(result !== "granted"){
        throw new Error("センサー利用が許可されませんでした．");
      }
    }

    window.removeEventListener("devicemotion", onMotion);
    window.addEventListener("devicemotion", onMotion);

    running = true;

    $("start").disabled = true;
    $("stop").disabled = false;

    $("status").textContent =
      "計測中：" + deviceType + " のセンサー情報を取得しています．";

  }catch(err){
    $("status").textContent = "開始できません：" + err.message;
  }
}

function stopSensor(){
  running = false;
  window.removeEventListener("devicemotion", onMotion);

  $("start").disabled = false;
  $("stop").disabled = true;

  $("status").textContent = "停止中";
}

function clearGraph(){
  accelData.x.length = 0;
  accelData.y.length = 0;
  accelData.z.length = 0;

  gyroData.a.length = 0;
  gyroData.b.length = 0;
  gyroData.g.length = 0;

  drawGraph();
}

$("accelBtn").addEventListener("click", () => setMode("accel"));
$("gyroBtn").addEventListener("click", () => setMode("gyro"));
$("start").addEventListener("click", startSensor);
$("stop").addEventListener("click", stopSensor);
$("clear").addEventListener("click", clearGraph);

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
</script>

</body>
</html>
