<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone Sensor Graph</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: Canvas;
    color: CanvasText;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 6px; }
  .note { opacity: .75; line-height: 1.55; margin-bottom: 14px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  button {
    font: inherit;
    font-weight: 700;
    padding: 10px 16px;
    border: 1px solid #8888;
    border-radius: 10px;
    background: ButtonFace;
    color: ButtonText;
  }
  button:disabled { opacity: .45; }
  #status {
    padding: 10px 12px;
    border: 1px solid #8885;
    border-radius: 10px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 8px;
    margin-bottom: 14px;
  }
  .card {
    border: 1px solid #8885;
    border-radius: 12px;
    padding: 10px;
  }
  .card .label { font-size: .85rem; opacity: .7; }
  .card .value { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .panel {
    border: 1px solid #8885;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 14px;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 8px; }
  canvas {
    display: block;
    width: 100%;
    height: 300px;
    border-radius: 8px;
    background: rgba(127,127,127,.06);
  }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem; margin-top:8px; }
  .legend span::before { content:"●"; margin-right:5px; }
  .x::before { color:#d33; }
  .y::before { color:#2a7; }
  .z::before { color:#37c; }
  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    canvas { height: 260px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>iPhone 内蔵センサー</h1>
  <div class="note">
    加速度（重力を含む）と回転速度を表示します．
    iPhoneでは「センサー開始」をタップして利用許可を与えてください．
  </div>

  <div class="buttons">
    <button id="start">センサー開始</button>
    <button id="stop" disabled>停止</button>
    <button id="clear">グラフ消去</button>
  </div>

  <div id="status">待機中</div>

  <div class="panel">
    <h2>加速度［m/s²］</h2>
    <div class="cards">
      <div class="card"><div class="label">X</div><div id="ax" class="value">---</div></div>
      <div class="card"><div class="label">Y</div><div id="ay" class="value">---</div></div>
      <div class="card"><div class="label">Z</div><div id="az" class="value">---</div></div>
    </div>
    <canvas id="graph"></canvas>
    <div class="legend"><span class="x">X</span><span class="y">Y</span><span class="z">Z</span></div>
  </div>

  <div class="panel">
    <h2>回転速度［deg/s］</h2>
    <div class="cards">
      <div class="card"><div class="label">α</div><div id="ra" class="value">---</div></div>
      <div class="card"><div class="label">β</div><div id="rb" class="value">---</div></div>
      <div class="card"><div class="label">γ</div><div id="rg" class="value">---</div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $("graph");
const ctx = canvas.getContext("2d");

const MAX_POINTS = 180;
const data = { x: [], y: [], z: [] };
let running = false;
let lastPlot = 0;
const PLOT_INTERVAL_MS = 50; // 約20 Hzで描画

function fmt(v) {
  return (typeof v === "number" && Number.isFinite(v)) ? v.toFixed(2) : "---";
}

function resizeCanvas() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGraph();
}

function push(arr, v) {
  arr.push(v);
  if (arr.length > MAX_POINTS) arr.shift();
}

function drawGraph() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // 表示範囲
  const ymin = -20;
  const ymax = 20;

  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(127,127,127,.25)";
  ctx.beginPath();
  for (let v = -20; v <= 20; v += 10) {
    const y = h - (v - ymin) / (ymax - ymin) * h;
    ctx.moveTo(0, y); ctx.lineTo(w, y);
  }
  ctx.stroke();

  function plot(arr, color) {
    if (arr.length < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    arr.forEach((v, i) => {
      const x = i / (MAX_POINTS - 1) * w;
      const vv = Math.max(ymin, Math.min(ymax, v));
      const y = h - (vv - ymin) / (ymax - ymin) * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  plot(data.x, "#d33");
  plot(data.y, "#2a7");
  plot(data.z, "#37c");
}

function onMotion(e) {
  if (!running) return;

  const a = e.accelerationIncludingGravity || e.acceleration || {};
  const r = e.rotationRate || {};

  $("ax").textContent = fmt(a.x);
  $("ay").textContent = fmt(a.y);
  $("az").textContent = fmt(a.z);

  $("ra").textContent = fmt(r.alpha);
  $("rb").textContent = fmt(r.beta);
  $("rg").textContent = fmt(r.gamma);

  const now = performance.now();
  if (now - lastPlot >= PLOT_INTERVAL_MS) {
    if (typeof a.x === "number") push(data.x, a.x);
    if (typeof a.y === "number") push(data.y, a.y);
    if (typeof a.z === "number") push(data.z, a.z);
    lastPlot = now;
    drawGraph();
  }
}

async function startSensor() {
  try {
    if (!window.isSecureContext) {
      throw new Error("HTTPSで開いてください．");
    }

    if (typeof DeviceMotionEvent === "undefined") {
      throw new Error("このブラウザではDeviceMotionEventを利用できません．");
    }

    // iPhone/iPad Safariではユーザー操作内で許可要求が必要
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const result = await DeviceMotionEvent.requestPermission();
      if (result !== "granted") {
        throw new Error("モーションセンサーの利用が許可されませんでした．");
      }
    }

    window.removeEventListener("devicemotion", onMotion);
    window.addEventListener("devicemotion", onMotion);

    running = true;
    $("start").disabled = true;
    $("stop").disabled = false;
    $("status").textContent = "計測中：iPhoneを動かしてみてください．";
  } catch (err) {
    $("status").textContent = "開始できません：" + err.message;
  }
}

function stopSensor() {
  running = false;
  window.removeEventListener("devicemotion", onMotion);
  $("start").disabled = false;
  $("stop").disabled = true;
  $("status").textContent = "停止中";
}

function clearGraph() {
  data.x.length = data.y.length = data.z.length = 0;
  drawGraph();
}

$("start").addEventListener("click", startSensor);
$("stop").addEventListener("click", stopSensor);
$("clear").addEventListener("click", clearGraph);
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
